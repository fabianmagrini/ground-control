services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ground-control-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: intelligence_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ground-control-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intelligence_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  ground-control-postgres-data:
