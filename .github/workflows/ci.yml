name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run check

      - name: Legacy syntax check
        run: npm run check:legacy

      - name: Intelligence eval regression gate
        run: npm run evals

      - name: Build
        run: npm run build

      - name: UI smoke tests
        run: npm run test:ui

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: ground-control-dist
          path: dist/
          if-no-files-found: error
